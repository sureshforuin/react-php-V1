name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build React & Deploy to app.medalya.in
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Push dist/ to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin deploy
          git checkout deploy

          # Sync React build to root (exclude backend folder)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='api-deploy/' \
            --exclude='deploy.php' \
            frontend/dist/ ./

          git add -A
          git diff --cached --quiet || git commit -m "deploy: frontend $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin deploy

      - name: Trigger Hostinger pull
        run: |
          curl -s -X POST https://app.medalya.in/deploy.php \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}"
