name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build React & Push to deploy branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Push dist to deploy branch
        run: |
          # Configure git
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and checkout deploy branch
          git fetch origin deploy
          git checkout deploy

          # Copy built files to root of deploy branch (keep /api separate)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='api/' \
            frontend/dist/ ./

          # Commit and push
          git add -A
          git diff --cached --quiet || git commit -m "deploy: frontend build from $(git rev-parse --short main)"
          git push origin deploy
