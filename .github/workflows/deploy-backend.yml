name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy PHP API to api.creyaengineering.com
    runs-on: ubuntu-latest
    permissions:
      contents: write        # allows github-actions[bot] to push to deploy branch

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Push backend to deploy branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin deploy
          git checkout deploy

          # Sync PHP files into /api-deploy folder in the deploy branch
          mkdir -p api-deploy
          rsync -av --delete \
            --exclude='.git' \
            --exclude='*.md' \
            --exclude='schema.sql' \
            --exclude='.env.php' \
            backend/api/ ./api-deploy/

          git add -A
          git diff --cached --quiet || git commit -m "deploy: backend $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git push origin deploy

      - name: Trigger Hostinger pull + copy to subdomain
        run: |
          curl -s -X POST https://app.creyaengineering.com/deploy.php \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            -H "X-Deploy-Target: backend"
