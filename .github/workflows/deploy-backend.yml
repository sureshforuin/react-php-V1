name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  push-php:
    name: Push PHP files to deploy branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Push PHP files to deploy branch
        run: |
          # Configure git
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch and checkout deploy branch
          git fetch origin deploy
          git checkout deploy

          # Sync PHP api files into /api folder
          mkdir -p api
          rsync -av --delete \
            --exclude='.git' \
            --exclude='*.md' \
            --exclude='schema.sql' \
            --exclude='.env.php' \
            backend/api/ ./api/

          # Commit and push
          git add -A
          git diff --cached --quiet || git commit -m "deploy: backend update from $(git rev-parse --short main)"
          git push origin deploy
